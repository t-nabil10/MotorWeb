<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motor Manager Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motor Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>
<aside id="side">
  <div class="brand"><i class="fa-solid fa-gauge-high"></i><div>Motor Manager<small>PRO</small></div></div>
  <nav id="nav"></nav>
</aside>
<div id="wrap">
  <header>
    <button id="burger" class="btn btn-light" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <h1 id="ttl"></h1>
  </header>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
